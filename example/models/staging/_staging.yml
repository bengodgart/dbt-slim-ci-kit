version: 2

models:
  - name: stg_customers
    description: "One row per customer, cleaned from the raw_customers seed."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - not_null
          - unique

  - name: stg_orders
    description: "One row per order, cleaned from the raw_orders seed."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: "Order lifecycle status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']
